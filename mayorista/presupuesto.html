<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Presupuesto — Decantcias Mayorista</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,162,75,0.15), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,162,75,0.12), transparent 40%),
      #0d0d0d;
    color: #f2eee2;
    min-height: 100vh;
    padding-bottom: 120px;
  }
  .gold { color: #c9a24b; }

  .container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 24px;
    border: 1px solid rgba(201,162,75,0.35);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(201,162,75,0.08);
  }

  /* Header */
  .header-top {
    text-align: center;
    border-bottom: 1px solid rgba(201,162,75,0.3);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .logo-header {
    display: block;
    max-width: 120px;
    margin: 0 auto 10px;
  }
  h1 { font-size: 22px; letter-spacing: 2px; margin: 0; font-weight: 800; }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .back-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #c9a24b;
    color: #c9a24b;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(201,162,75,0.4);
    background: #1a1a1a;
    color: #fff;
    font-size: 14px;
  }
  .search-input:focus { outline: 1px solid #c9a24b; }

  #status { text-align: center; opacity: 0.75; padding: 40px 0; }

  /* Secciones por Marca */
  .brand-group { margin-bottom: 32px; }
  .brand-title {
    font-size: 16px;
    letter-spacing: 1px;
    border-left: 3px solid #c9a24b;
    padding-left: 10px;
    margin: 0 0 16px 0;
    text-transform: uppercase;
  }

  /* Grilla 5 por linea */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }

  .item-card {
    background: #161616;
    border: 1px solid rgba(201,162,75,0.25);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: space-between;
  }
  .item-card img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    background: #222;
    margin-bottom: 8px;
  }
  .item-card .noimg {
    width: 64px;
    height: 64px;
    border-radius: 6px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    opacity: 0.5;
    margin-bottom: 8px;
  }
  .item-name {
    font-size: 12px;
    font-weight: 600;
    margin: 0 0 4px 0;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    height: 28px;
  }
  .item-price {
    font-size: 13px;
    font-weight: 800;
    color: #c9a24b;
    margin: 2px 0;
  }
  .item-details {
    font-size: 10px;
    opacity: 0.6;
    margin: 0 0 8px 0;
  }

  /* Controles de Cantidad (+ / -) */
  .qty-controls {
    display: flex;
    align-items: center;
    background: #222;
    border: 1px solid rgba(201,162,75,0.4);
    border-radius: 6px;
    overflow: hidden;
    width: 100%;
    justify-content: space-between;
  }
  .qty-btn {
    background: transparent;
    border: none;
    color: #c9a24b;
    font-weight: bold;
    font-size: 14px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .qty-btn:hover { background: rgba(201,162,75,0.2); }
  .qty-count {
    font-size: 12px;
    font-weight: 600;
  }

  /* Barra Flotante Inferior */
  .cart-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #141414;
    border-top: 1px solid rgba(201,162,75,0.5);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 -10px 25px rgba(0,0,0,0.8);
    z-index: 1000;
  }
  .cart-summary {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .cart-totals {
    display: flex;
    flex-direction: column;
  }
  .cart-totals .total-label { font-size: 12px; opacity: 0.7; }
  .cart-totals .total-amount { font-size: 20px; font-weight: 800; color: #c9a24b; }

  .review-btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid rgba(201,162,75,0.6);
    background: #1f1f1f;
    color: #c9a24b;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .review-btn:hover {
    background: #c9a24b;
    color: #1a1a1a;
  }
  .review-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .action-btns {
    display: flex;
    gap: 10px;
  }

  #generatePdfBtn {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg,#f2d98d,#c9a24b);
    color: #1a1a1a;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.5px;
    font-size: 14px;
  }
  #generatePdfBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Modal de Revisión de Pedido */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  
  .modal-content {
    background: #141414;
    border: 1px solid rgba(201,162,75,0.4);
    border-radius: 12px;
    width: 100%;
    max-width: 600px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
  }
  .modal-header {
    padding: 16px;
    border-bottom: 1px solid rgba(201,162,75,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { margin: 0; font-size: 18px; color: #c9a24b; }
  .close-modal {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }

  .modal-body {
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cart-item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1c1c1c;
    border: 1px solid rgba(201,162,75,0.2);
    padding: 8px 12px;
    border-radius: 8px;
    gap: 10px;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-title { font-size: 13px; font-weight: 600; margin: 0; }
  .cart-item-sub { font-size: 11px; opacity: 0.6; margin: 2px 0 0 0; }
  .cart-item-actions { display: flex; align-items: center; gap: 12px; }
  .cart-item-price { font-size: 13px; font-weight: 800; color: #c9a24b; }
  
  .remove-item-btn {
    background: rgba(226, 107, 107, 0.15);
    border: 1px solid rgba(226, 107, 107, 0.4);
    color: #e26b6b;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .remove-item-btn:hover { background: #e26b6b; color: #fff; }

  .modal-footer {
    padding: 16px;
    border-top: 1px solid rgba(201,162,75,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .clear-all-btn {
    background: transparent;
    border: 1px solid #e26b6b;
    color: #e26b6b;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .clear-all-btn:hover { background: #e26b6b; color: #fff; }

  @media (max-width: 1024px) { .items-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 768px) { .items-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 550px) {
    .items-grid { grid-template-columns: repeat(2, 1fr); }
    .cart-bar { flex-direction: column; gap: 12px; align-items: stretch; }
    .cart-summary { justify-content: space-between; }
    .action-btns { justify-content: flex-end; }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="header-top">
      <img src="../fotos/logodecant.png" alt="Decantcias" class="logo-header" />
      <h1>Armar <span class="gold">Presupuesto</span></h1>
    </div>

    <div class="toolbar">
      <a href="index.html" class="back-btn">← Volver</a>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar perfume o marca..." />
    </div>

    <div id="status">Cargando catálogo...</div>
    <div id="catalogContainer"></div>
  </div>

  <!-- Barra Fija para Confirmar Presupuesto -->
  <div class="cart-bar">
    <div class="cart-summary">
      <div class="cart-totals">
        <span class="total-label" id="itemsCount">0 productos seleccionados</span>
        <span class="total-amount" id="totalPrice">$0</span>
      </div>
      <button class="review-btn" id="reviewBtn" disabled onclick="openModal()">Revisar pedido</button>
    </div>
    <div class="action-btns">
      <button id="generatePdfBtn" disabled>Descargar PDF</button>
    </div>
  </div>

  <!-- Modal de Revisión -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Revisión de Pedido</h3>
        <button class="close-modal" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalList">
        <!-- Ítems del carrito -->
      </div>
      <div class="modal-footer">
        <button class="clear-all-btn" onclick="clearCart()">Vaciar pedido</button>
        <button class="review-btn" onclick="closeModal()">Seguir agregando</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    if (sessionStorage.getItem("mayorista_auth") !== "ok") {
      window.location.href = "index.html";
    }

    const CATALOG_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsmuT-sX_hT2VXW9_7AbpfRkS1plqwYKV3zrzUVDUf44aEhUZU7btUwp_QUwDoNbv3VANut3ZntOzK/pub?gid=751988153&single=true&output=csv";
    const WHOLESALE_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsmuT-sX_hT2VXW9_7AbpfRkS1plqwYKV3zrzUVDUf44aEhUZU7btUwp_QUwDoNbv3VANut3ZntOzK/pub?gid=89266512&single=true&output=csv";

    let ALL_PRODUCTS = [];
    let IMAGE_MAP = {}; 
    let CART = {};

    function normKey(s) {
      return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[()]/g, "").replace(/\s+/g, "").trim();
    }

    function moneyAR(n) {
      const v = Number(n);
      return `$${(Number.isFinite(v) ? v : 0).toLocaleString("es-AR")}`;
    }

    function parseUSMoney(raw) {
      if (raw == null) return 0;
      const cleaned = String(raw).replace(/\$/g, "").replace(/,/g, "").trim();
      const n = parseFloat(cleaned);
      return Number.isFinite(n) ? n : 0;
    }

    function toNumber(raw) {
      const n = parseFloat(String(raw || "").replace(/[^\d.-]/g, ""));
      return Number.isFinite(n) ? n : 0;
    }

    function imgPath(p) {
      if (!p) return "";
      if (/^https?:\/\//i.test(p)) return p;
      return "../" + p.replace(/^\/+/, "");
    }

    function parseWholesaleBlocks(csvText) {
      const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: "greedy" });
      const rows = parsed.data;
      const items = [];

      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        for (let c = 0; c < row.length; c++) {
          if (
            normKey(row[c]) === "marca" &&
            normKey(row[c + 1]) === "perfume" &&
            normKey(row[c + 2]) === "precio"
          ) {
            let rr = r + 1;
            while (rr < rows.length) {
              const rowr = rows[rr] || [];
              const marca = (rowr[c] || "").trim();
              const nombre = (rowr[c + 1] || "").trim();
              if (!marca && !nombre) break;

              if (marca && nombre) {
                const precio = parseUSMoney(rowr[c + 2]);
                const stock = toNumber(rowr[c + 3]);
                const ml = toNumber(rowr[c + 4]);
                const id = `${normKey(marca)}_${normKey(nombre)}_${ml}`;
                items.push({ id, marca, nombre, precio, stock, ml });
              }
              rr++;
            }
          }
        }
      }
      return items;
    }

    async function cargarCatalogo() {
      const statusEl = document.getElementById("status");
      try {
        const catRes = await fetch(CATALOG_CSV, { cache: "no-store" });
        const catText = await catRes.text();
        const catParsed = Papa.parse(catText, { header: true, skipEmptyLines: true });

        catParsed.data.forEach((row) => {
          const clean = {};
          for (const k in row) {
            const kk = (k || "").replace(/^\uFEFF/, "").trim();
            clean[kk] = (row[k] ?? "").toString().trim();
          }
          const marca = clean.marca || clean.Marca || "";
          const nombre = clean.nombre || clean.Nombre || "";
          const imagenRaw = clean.imagenURL || clean.imagenUrl || clean.imagen || "";
          const firstImg = String(imagenRaw).split("|")[0].trim();
          if (marca && nombre && firstImg) {
            const key = normKey(marca) + "|" + normKey(nombre);
            IMAGE_MAP[key] = firstImg;
          }
        });

        const res = await fetch(WHOLESALE_CSV, { cache: "no-store" });
        const text = await res.text();
        let items = parseWholesaleBlocks(text);

        items = items.filter((it) => Math.abs(it.precio - 900) > 0.01 && it.precio > 0);

        items = items.map((it) => {
          const key = normKey(it.marca) + "|" + normKey(it.nombre);
          const img = IMAGE_MAP[key];
          return { ...it, img: img ? imgPath(img) : "" };
        });

        ALL_PRODUCTS = items;
        statusEl.style.display = "none";
        renderList(ALL_PRODUCTS);
      } catch (e) {
        console.error(e);
        statusEl.textContent = "Error al obtener la lista de productos.";
      }
    }

    function renderList(products) {
      const container = document.getElementById("catalogContainer");
      container.innerHTML = "";

      const byBrand = {};
      products.forEach((it) => {
        byBrand[it.marca] = byBrand[it.marca] || [];
        byBrand[it.marca].push(it);
      });

      const sortedBrands = Object.keys(byBrand).sort((a, b) =>
        a.localeCompare(b, "es", { sensitivity: "base" })
      );

      if (sortedBrands.length === 0) {
        container.innerHTML = `<p style="text-align:center; opacity:0.6;">No se encontraron resultados.</p>`;
        return;
      }

      sortedBrands.forEach((brand) => {
        const group = document.createElement("div");
        group.className = "brand-group";

        const itemsList = byBrand[brand].sort((a, b) =>
          a.nombre.localeCompare(b.nombre, "es", { sensitivity: "base" })
        );

        let itemsHtml = itemsList.map((it) => {
          const qty = CART[it.id] || 0;
          const imgHtml = it.img
            ? `<img src="${it.img}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'Sin foto'}))">`
            : `<div class="noimg">Sin foto</div>`;

          return `
            <div class="item-card">
              ${imgHtml}
              <p class="item-name" title="${it.nombre}">${it.nombre}</p>
              <span class="item-price">${moneyAR(it.precio)}</span>
              <p class="item-details">${it.ml} ml · Stock: ${it.stock}</p>
              
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty('${it.id}', -1)">-</button>
                <span class="qty-count" id="qty_${it.id}">${qty}</span>
                <button class="qty-btn" onclick="updateQty('${it.id}', 1)">+</button>
              </div>
            </div>
          `;
        }).join("");

        group.innerHTML = `
          <h2 class="brand-title">${brand}</h2>
          <div class="items-grid">${itemsHtml}</div>
        `;
        container.appendChild(group);
      });
    }

    function updateQty(id, change) {
      const current = CART[id] || 0;
      const updated = Math.max(0, current + change);

      if (updated === 0) {
        delete CART[id];
      } else {
        CART[id] = updated;
      }

      // Actualizar contador en la grilla si existe
      const counterEl = document.getElementById(`qty_${id}`);
      if (counterEl) counterEl.textContent = updated;

      recalculateTotals();
      if (document.getElementById("modalOverlay").classList.contains("active")) {
        renderModalList();
      }
    }

    function removeItem(id) {
      delete CART[id];
      const counterEl = document.getElementById(`qty_${id}`);
      if (counterEl) counterEl.textContent = 0;

      recalculateTotals();
      renderModalList();
    }

    function clearCart() {
      CART = {};
      document.querySelectorAll(".qty-count").forEach(el => el.textContent = 0);
      recalculateTotals();
      closeModal();
    }

    function recalculateTotals() {
      let totalUnits = 0;
      let totalPrice = 0;

      for (const id in CART) {
        const qty = CART[id];
        const item = ALL_PRODUCTS.find((p) => p.id === id);
        if (item) {
          totalUnits += qty;
          totalPrice += item.precio * qty;
        }
      }

      document.getElementById("itemsCount").textContent = `${totalUnits} ${totalUnits === 1 ? 'unidad seleccionada' : 'unidades seleccionadas'}`;
      document.getElementById("totalPrice").textContent = moneyAR(totalPrice);
      document.getElementById("generatePdfBtn").disabled = totalUnits === 0;
      document.getElementById("reviewBtn").disabled = totalUnits === 0;
      document.getElementById("reviewBtn").textContent = `Revisar pedido (${totalUnits})`;
    }

    // Modal
    function openModal() {
      renderModalList();
      document.getElementById("modalOverlay").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("active");
    }

    function renderModalList() {
      const container = document.getElementById("modalList");
      container.innerHTML = "";

      const keys = Object.keys(CART);
      if (keys.length === 0) {
        container.innerHTML = `<p style="text-align:center; opacity:0.6; padding: 20px;">No hay productos en el pedido.</p>`;
        closeModal();
        return;
      }

      keys.forEach((id) => {
        const qty = CART[id];
        const item = ALL_PRODUCTS.find((p) => p.id === id);
        if (!item) return;

        const row = document.createElement("div");
        row.className = "cart-item-row";
        row.innerHTML = `
          <div class="cart-item-info">
            <p class="cart-item-title">${item.marca} - ${item.nombre}</p>
            <p class="cart-item-sub">${item.ml} ml · ${moneyAR(item.precio)} c/u</p>
          </div>
          <div class="cart-item-actions">
            <div class="qty-controls" style="width: auto;">
              <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
              <span class="qty-count" style="padding: 0 8px;">${qty}</span>
              <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
            </div>
            <span class="cart-item-price">${moneyAR(item.precio * qty)}</span>
            <button class="remove-item-btn" onclick="removeItem('${item.id}')" title="Quitar item">✕</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Buscador
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = normKey(e.target.value);
      const filtered = ALL_PRODUCTS.filter((it) =>
        normKey(it.nombre).includes(term) || normKey(it.marca).includes(term)
      );
      renderList(filtered);
    });

    // Helper imagen PDF
    async function imageToDataURL(url) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return null;
      }
    }

    // PDF
    document.getElementById("generatePdfBtn").addEventListener("click", async () => {
      const btn = document.getElementById("generatePdfBtn");
      btn.disabled = true;
      btn.textContent = "Generando PDF...";

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });

        const marginX = 15;
        const pageHeight = 297;
        const pageWidth = 210;
        let y = 15;

        const logoDataUrl = await imageToDataURL("../fotos/logodecant.png");
        if (logoDataUrl) {
          const logoWidth = 26;
          doc.addImage(logoDataUrl, "PNG", (pageWidth - logoWidth) / 2, y, logoWidth, logoWidth * 0.75);
          y += logoWidth * 0.75 + 6;
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.text("Presupuesto Mayorista — Decantcias", pageWidth / 2, y, { align: "center" });
        y += 6;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        const fecha = new Date().toLocaleDateString("es-AR", { year: 'numeric', month: 'long', day: 'numeric' });
        doc.text(`Fecha: ${fecha}`, pageWidth / 2, y, { align: "center" });
        y += 10;

        // Tabla Header
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.setFillColor(240, 240, 240);
        doc.rect(marginX, y, pageWidth - (marginX * 2), 8, "F");
        
        doc.text("Producto", marginX + 3, y + 5.5);
        doc.text("Cant.", marginX + 110, y + 5.5, { align: "center" });
        doc.text("P. Unitario", marginX + 140, y + 5.5, { align: "right" });
        doc.text("Subtotal", marginX + 175, y + 5.5, { align: "right" });
        y += 12;

        let totalGeneral = 0;
        let totalUnidades = 0;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);

        for (const id in CART) {
          const qty = CART[id];
          const item = ALL_PRODUCTS.find((p) => p.id === id);
          if (!item) continue;

          const subtotal = item.precio * qty;
          totalGeneral += subtotal;
          totalUnidades += qty;

          if (y > pageHeight - 30) {
            doc.addPage();
            y = 20;
          }

          const itemText = `${item.marca} - ${item.nombre} (${item.ml}ml)`;
          const truncatedText = doc.splitTextToSize(itemText, 100)[0];

          doc.text(truncatedText, marginX + 3, y);
          doc.text(String(qty), marginX + 110, y, { align: "center" });
          doc.text(moneyAR(item.precio), marginX + 140, y, { align: "right" });
          doc.text(moneyAR(subtotal), marginX + 175, y, { align: "right" });

          y += 7;
        }

        y += 4;
        doc.setLineWidth(0.5);
        doc.line(marginX, y, pageWidth - marginX, y);
        y += 8;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text(`Total Unidades: ${totalUnidades}`, marginX + 3, y);
        doc.text(`TOTAL FINAL: ${moneyAR(totalGeneral)}`, marginX + 175, y, { align: "right" });

        y += 16;
        if (y > pageHeight - 30) {
          doc.addPage();
          y = 20;
        }
        doc.setFont("helvetica", "italic");
        doc.setFontSize(9);
        const nota = doc.splitTextToSize(
          "Este documento es una cotización estimada. Los precios y el stock están sujetos a confirmación definitiva al momento de concretar el pedido.",
          pageWidth - (marginX * 2)
        );
        doc.text(nota, marginX, y);

        doc.save(`presupuesto-decantcias-${Date.now()}.pdf`);
      } catch (e) {
        console.error(e);
        alert("Error al generar el presupuesto en PDF.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Descargar PDF";
      }
    });

    cargarCatalogo();
  </script>
</body>
</html>
