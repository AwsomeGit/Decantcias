<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decantcias — Mayorista</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f0f11;
      --card-bg: #18181c;
      --accent-gold: #c9a24b;
      --accent-gold-light: #f2d98d;
      --border-color: #2a2a30;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    .header-container {
      text-align: center;
      padding: 25px 15px 15px;
    }

    .logo-img {
      max-width: 120px;
      height: auto;
      margin-bottom: 10px;
    }

    .page-title {
      font-size: 2rem;
      color: var(--accent-gold-light);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .toolbar {
      max-width: 1200px;
      margin: 15px auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 10px 15px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .price-tier-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .tier-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .tier-btn.active {
      background: var(--accent-gold);
      color: #000;
    }

    .stock-filter-btn, .action-top-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .stock-filter-btn.active {
      border-color: var(--accent-gold);
      color: var(--accent-gold-light);
    }

    .download-full-pdf-btn {
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
      color: #111;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .download-full-pdf-btn:hover {
      opacity: 0.9;
    }

    .catalog-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .brand-section {
      margin-bottom: 30px;
    }

    .brand-title {
      font-size: 1.4rem;
      color: var(--accent-gold);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .product-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 6px;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: #fff;
    }

    .product-details {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-gold-light);
      margin-bottom: 12px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      background: #0f0f11;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      width: 100%;
    }

    .qty-btn {
      background: transparent;
      border: none;
      color: var(--accent-gold);
      width: 35px;
      height: 35px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .qty-btn:hover {
      background: rgba(201, 162, 75, 0.1);
    }

    .qty-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* BARRA INFERIOR DEL CARRITO */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #141417;
      border-top: 1px solid var(--border-color);
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
    }

    .cart-summary .items-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .cart-summary .total-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-gold-light);
    }

    .download-cart-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .download-cart-btn:disabled {
      background: #3a3a40;
      color: #777;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header-container">
    <img src="../fotos/logodecant.png" alt="Decantcias" class="logo-img" onerror="this.style.display='none'" />
    <h1 class="page-title">Armar Presupuesto</h1>
  </header>

  <!-- BARRA DE HERRAMIENTAS Y BOTÓN DESCARGAR PDF ARRIBA -->
  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar perfume o marca..." />
    
    <div class="price-tier-switch">
      <button class="tier-btn active" data-tier="10U" onclick="setPriceTier('10U')">10+ U</button>
      <button class="tier-btn" data-tier="5U" onclick="setPriceTier('5U')">5+ U</button>
      <button class="tier-btn" data-tier="3U" onclick="setPriceTier('3U')">3+ U</button>
    </div>

    <button id="onlyStockBtn" class="stock-filter-btn" type="button" onclick="toggleStockFilter()">
      <span id="stockCheckIcon">✓</span> Solo en stock
    </button>

    <!-- BOTÓN SUPERIOR SOLICITADO: Descarga catálogo completo con las 3 escalas -->
    <button id="downloadFullCatalogPdfBtn" class="download-full-pdf-btn">
      Descargar PDF
    </button>
  </div>

  <!-- CATÁLOGO -->
  <main class="catalog-container" id="catalogContainer">
    <p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Cargando catálogo...</p>
  </main>

  <!-- BARRA INFERIOR DE PRESUPUESTO -->
  <div class="cart-bar">
    <div class="cart-summary">
      <span class="items-count" id="cartCountLabel">Productos seleccionados: 0</span>
      <span class="total-price" id="cartTotalLabel">$0</span>
    </div>
    <div class="action-btns">
      <!-- BOTÓN INFERIOR SOLICITADO: Descarga solo los ítems presupuestados -->
      <button id="generatePdfBtn" class="download-cart-btn" disabled>
        Descargar presupuesto
      </button>
    </div>
  </div>

  <script>
    let ALL_PRODUCTS = [];
    let currentTier = '10U';
    let filterOnlyStock = false;
    let cart = {}; // { itemId: cantidad }

    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsmuT-sX_hT2VXW9_7AbpfRkS1plqwYKV3zrzUVDUf44aEhUZU7btUwp_QUwDoNbv3VANut3ZntOzK/pub?gid=89266512&single=true&output=csv'; // Reemplazar con tu URL de CSV si aplica

    // Convertir valor monetario
    function parseUSMoney(raw) {
      if (raw == null) return 0;
      let cleaned = String(raw).replace(/\$/g, "").trim();
      cleaned = cleaned.replace(/\./g, "").replace(/,/g, ".");
      const n = parseFloat(cleaned);
      return Number.isFinite(n) ? n : 0;
    }

    function moneyAR(val) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(val);
    }

    // Cargar Catálogo
    async function cargarCatalogo() {
      try {
        const response = await fetch(SHEET_URL);
        const data = await response.text();
        
        // Parse simple de CSV
        const lines = data.split('\n').map(l => l.split(','));
        const items = [];

        for (let i = 1; i < lines.length; i++) {
          const row = lines[i];
          if (!row || row.length < 4) continue;

          const marca = row[0]?.trim() || 'VARIOS';
          const nombre = row[1]?.trim() || '';
          const ml = row[2]?.trim() || '';
          const stock = parseInt(row[3]) || 0;
          
          const p10 = parseUSMoney(row[4]);
          const p5 = parseUSMoney(row[5]);
          const p3 = parseUSMoney(row[6]);

          // Filtrar items sin precio válido o con precio 900
          if (p10 === 900 || p5 === 900 || p3 === 900) continue;
          if (p10 <= 0 && p3 <= 0) continue;

          items.push({
            id: `prod_${i}`,
            marca,
            nombre,
            ml,
            stock,
            precio10U: p10,
            precio5U: p5,
            precio3U: p3,
            img: `../fotos/${nombre.toLowerCase().replace(/\s+/g, '')}.jpg`
          });
        }

        ALL_PRODUCTS = items;
        renderCatalog();
      } catch (e) {
        console.error("Error al cargar catálogo:", e);
        document.getElementById('catalogContainer').innerHTML = `<p style="text-align:center; color:red;">Error al cargar los productos.</p>`;
      }
    }

    // Renderizar HTML
    function renderCatalog() {
      const container = document.getElementById('catalogContainer');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      container.innerHTML = '';

      let filtered = ALL_PRODUCTS.filter(p => {
        const matchesSearch = p.marca.toLowerCase().includes(search) || p.nombre.toLowerCase().includes(search);
        const matchesStock = filterOnlyStock ? p.stock > 0 : true;
        return matchesSearch && matchesStock;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:30px;">No se encontraron productos.</p>`;
        return;
      }

      // Agrupar por Marca
      const grouped = {};
      filtered.forEach(p => {
        if (!grouped[p.marca]) grouped[p.marca] = [];
        grouped[p.marca].push(p);
      });

      Object.keys(grouped).sort().forEach(marca => {
        const brandSec = document.createElement('div');
        brandSec.className = 'brand-section';
        
        let html = `<h2 class="brand-title">${marca}</h2><div class="products-grid">`;

        grouped[marca].forEach(item => {
          const price = item[`precio${currentTier}`] || item.precio10U;
          const qty = cart[item.id] || 0;

          html += `
            <div class="product-card">
              <img src="${item.img}" class="product-img" onerror="this.src='https://via.placeholder.com/100?text=Decantcias'" />
              <div class="product-name">${item.nombre}</div>
              <div class="product-details">${item.ml} ml - Stock: ${item.stock}</div>
              <div class="product-price">${moneyAR(price)}</div>
              <div class="quantity-control">
                <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                <input type="text" class="qty-input" value="${qty}" readonly />
                <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        brandSec.innerHTML = html;
        container.appendChild(brandSec);
      });

      updateCartBar();
    }

    function setPriceTier(tier) {
      currentTier = tier;
      document.querySelectorAll('.tier-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tier === tier);
      });
      renderCatalog();
    }

    function toggleStockFilter() {
      filterOnlyStock = !filterOnlyStock;
      const btn = document.getElementById('onlyStockBtn');
      btn.classList.toggle('active', filterOnlyStock);
      renderCatalog();
    }

    function updateQty(id, change) {
      const current = cart[id] || 0;
      const updated = Math.max(0, current + change);
      if (updated === 0) {
        delete cart[id];
      } else {
        cart[id] = updated;
      }
      renderCatalog();
    }

    function updateCartBar() {
      let count = 0;
      let total = 0;

      Object.keys(cart).forEach(id => {
        const item = ALL_PRODUCTS.find(p => p.id === id);
        if (item) {
          const qty = cart[id];
          const price = item[`precio${currentTier}`] || item.precio10U;
          count += qty;
          total += price * qty;
        }
      });

      document.getElementById('cartCountLabel').textContent = `Productos seleccionados: ${count}`;
      document.getElementById('cartTotalLabel').textContent = moneyAR(total);
      
      const btn = document.getElementById('generatePdfBtn');
      btn.disabled = count === 0;
    }

    document.getElementById('searchInput').addEventListener('input', renderCatalog);

    // Helper para imagen base64
    function imageToDataURL(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    // ==========================================
    // 1. DESCARGAR PDF COMPLETO (3 PRECIOS)
    // ==========================================
    document.getElementById("downloadFullCatalogPdfBtn").addEventListener("click", async () => {
      const btn = document.getElementById("downloadFullCatalogPdfBtn");
      btn.disabled = true;
      btn.textContent = "Generando...";

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });

        const marginX = 12;
        const pageHeight = 297;
        const pageWidth = 210;
        let y = 15;

        // Logo
        const logoDataUrl = await imageToDataURL("../fotos/logodecant.png");
        if (logoDataUrl) {
          doc.addImage(logoDataUrl, "PNG", (pageWidth - 24) / 2, y, 24, 18);
          y += 22;
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(15);
        doc.text("Catálogo Completo — Decantcias Mayorista", pageWidth / 2, y, { align: "center" });
        y += 6;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        const fecha = new Date().toLocaleDateString("es-AR", { year: 'numeric', month: 'long', day: 'numeric' });
        doc.text(`Lista actualizada al: ${fecha}`, pageWidth / 2, y, { align: "center" });
        y += 8;

        const printHeader = () => {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.5);
          doc.setFillColor(230, 230, 230);
          doc.rect(marginX, y, pageWidth - (marginX * 2), 6.5, "F");

          doc.text("Producto / Detalle", marginX + 3, y + 4.5);
          doc.text("Precio 10+ U", marginX + 110, y + 4.5, { align: "right" });
          doc.text("Precio 5+ U", marginX + 145, y + 4.5, { align: "right" });
          doc.text("Precio 3+ U", marginX + 180, y + 4.5, { align: "right" });
          y += 9;
        };

        printHeader();

        ALL_PRODUCTS.forEach((item) => {
          if (y > pageHeight - 15) {
            doc.addPage();
            y = 15;
            printHeader();
          }

          const itemText = `${item.marca} - ${item.nombre} (${item.ml}ml)`;
          const truncatedText = doc.splitTextToSize(itemText, 90)[0];

          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.text(truncatedText, marginX + 3, y);
          doc.text(moneyAR(item.precio10U), marginX + 110, y, { align: "right" });
          doc.text(moneyAR(item.precio5U), marginX + 145, y, { align: "right" });
          doc.text(moneyAR(item.precio3U), marginX + 180, y, { align: "right" });

          y += 3.5;
          doc.setLineWidth(0.05);
          doc.setDrawColor(220, 220, 220);
          doc.line(marginX + 3, y, pageWidth - marginX, y);
          y += 3.8;
        });

        doc.save(`catalogo-completo-decantcias.pdf`);
      } catch (e) {
        console.error(e);
        alert("Error al generar el PDF del catálogo completo.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Descargar PDF";
      }
    });

    // ==========================================
    // 2. DESCARGAR PRESUPUESTO DEL CARRITO
    // ==========================================
    document.getElementById("generatePdfBtn").addEventListener("click", async () => {
      const btn = document.getElementById("generatePdfBtn");
      btn.disabled = true;

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });

        const marginX = 15;
        const pageWidth = 210;
        let y = 15;

        // Logo
        const logoDataUrl = await imageToDataURL("../fotos/logodecant.png");
        if (logoDataUrl) {
          doc.addImage(logoDataUrl, "PNG", (pageWidth - 26) / 2, y, 26, 20);
          y += 24;
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.text("Presupuesto de Compra — Decantcias", pageWidth / 2, y, { align: "center" });
        y += 6;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text(`Escala seleccionada: ${currentTier}`, pageWidth / 2, y, { align: "center" });
        y += 10;

        // Encabezado
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9);
        doc.setFillColor(240, 240, 240);
        doc.rect(marginX, y, pageWidth - (marginX * 2), 7, "F");

        doc.text("Producto", marginX + 3, y + 5);
        doc.text("Cant.", marginX + 110, y + 5, { align: "center" });
        doc.text("P. Unit", marginX + 145, y + 5, { align: "right" });
        doc.text("Subtotal", marginX + 180, y + 5, { align: "right" });
        y += 10;

        let grandTotal = 0;

        Object.keys(cart).forEach((id) => {
          const item = ALL_PRODUCTS.find((p) => p.id === id);
          if (!item) return;

          const qty = cart[id];
          const unitPrice = item[`precio${currentTier}`] || item.precio10U;
          const subtotal = unitPrice * qty;
          grandTotal += subtotal;

          const itemText = `${item.marca} - ${item.nombre} (${item.ml}ml)`;

          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.text(doc.splitTextToSize(itemText, 90)[0], marginX + 3, y);
          doc.text(String(qty), marginX + 110, y, { align: "center" });
          doc.text(moneyAR(unitPrice), marginX + 145, y, { align: "right" });
          doc.text(moneyAR(subtotal), marginX + 180, y, { align: "right" });

          y += 4;
          doc.setLineWidth(0.08);
          doc.setDrawColor(220, 220, 220);
          doc.line(marginX + 3, y, pageWidth - marginX, y);
          y += 5;
        });

        // Total
        y += 5;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(12);
        doc.text(`TOTAL ESTIMADO: ${moneyAR(grandTotal)}`, pageWidth - marginX, y, { align: "right" });

        doc.save(`presupuesto-decantcias-${Date.now()}.pdf`);
      } catch (e) {
        console.error(e);
        alert("Error al generar el presupuesto.");
      } finally {
        btn.disabled = false;
      }
    });

    // Iniciar carga
    cargarCatalogo();
  </script>
</body>
</html>
