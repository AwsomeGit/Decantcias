<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Decantcias — Mayorista</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0d0d0d;
    color: #f2eee2;
    min-height: 100vh;
  }
  .gold { color: #c9a24b; }

  /* ---------- Login ---------- */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    text-align: center;
  }
  #loginScreen h1 { font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; }
  #loginScreen input {
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #c9a24b;
    background: #1a1a1a;
    color: #fff;
    font-size: 16px;
    width: 260px;
    max-width: 80vw;
  }
  #loginScreen button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg,#f2d98d,#c9a24b);
    color: #1a1a1a;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #loginError { color: #e26b6b; font-size: 14px; min-height: 18px; }

  /* ---------- Contenido ---------- */
  #app { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid rgba(201,162,75,0.5);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  header.top h1 { font-size: 22px; letter-spacing: 2px; margin: 0; font-weight: 800; }
  #downloadPdfBtn {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg,#f2d98d,#c9a24b);
    color: #1a1a1a;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  #downloadPdfBtn:disabled { opacity: 0.6; cursor: default; }

  #status { text-align: center; opacity: 0.75; padding: 40px 0; }

  .brand-block { margin-bottom: 32px; }
  .brand-block h2 {
    font-size: 18px;
    letter-spacing: 1px;
    border-left: 3px solid #c9a24b;
    padding-left: 10px;
    margin-bottom: 14px;
  }
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .item-card {
    background: #161616;
    border: 1px solid rgba(201,162,75,0.3);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .item-card img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 6px;
    background: #222;
    flex-shrink: 0;
  }
  .item-card .noimg {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    background: #222;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    opacity: 0.5;
    text-align: center;
  }
  .item-card .info { min-width: 0; }
  .item-card .name { font-size: 13px; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
    .item-card .price { font-size: 14px; font-weight: 800; color: #c9a24b; margin: 0; }
  .item-card .meta { font-size: 11px; opacity: 0.6; margin: 2px 0 0; }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <h1>DECANT<span class="gold">CIAS</span></h1>
    <p style="opacity:.7;margin-top:-8px">Acceso mayorista</p>
    <input type="password" id="passInput" placeholder="Contraseña" autocomplete="off" />
    <button id="passBtn" type="button">Ingresar</button>
    <div id="loginError"></div>
  </div>

  <!-- CONTENIDO -->
  <div id="app">
    <header class="top">
      <h1>Precios <span class="gold">Mayoristas</span></h1>
      <button id="downloadPdfBtn" type="button">Descargar PDF completo</button>
    </header>
    <div id="status">Cargando datos...</div>
    <div id="brandsContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // ------------------------------------------------------
    // CONFIG
    // ------------------------------------------------------
    const PASSWORD = "JeaAwsMayorista*";

    const CATALOG_CSV =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsmuT-sX_hT2VXW9_7AbpfRkS1plqwYKV3zrzUVDUf44aEhUZU7btUwp_QUwDoNbv3VANut3ZntOzK/pub?gid=751988153&single=true&output=csv";

    const WHOLESALE_CSV =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsmuT-sX_hT2VXW9_7AbpfRkS1plqwYKV3zrzUVDUf44aEhUZU7btUwp_QUwDoNbv3VANut3ZntOzK/pub?gid=89266512&single=true&output=csv";

    // ------------------------------------------------------
    // LOGIN
    // ------------------------------------------------------
    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("app");
    const passInput = document.getElementById("passInput");
    const passBtn = document.getElementById("passBtn");
    const loginError = document.getElementById("loginError");

    function tryLogin() {
      if (passInput.value === PASSWORD) {
        sessionStorage.setItem("mayorista_auth", "ok");
        loginScreen.style.display = "none";
        app.style.display = "block";
        cargarTodo();
      } else {
        loginError.textContent = "Contraseña incorrecta.";
      }
    }

    passBtn.addEventListener("click", tryLogin);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryLogin();
    });

    if (sessionStorage.getItem("mayorista_auth") === "ok") {
      loginScreen.style.display = "none";
      app.style.display = "block";
      cargarTodo();
    }

    // ------------------------------------------------------
    // Helpers
    // ------------------------------------------------------
     function normKey(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[()]/g, "")
        .replace(/\s+/g, "")
        .trim();
    }

    function moneyAR(n) {
      const v = Number(n);
      return `$${(Number.isFinite(v) ? v : 0).toLocaleString("es-AR")}`;
    }

    function parseUSMoney(raw) {
      if (raw == null) return 0;
      const cleaned = String(raw).replace(/\$/g, "").replace(/,/g, "").trim();
      const n = parseFloat(cleaned);
      return Number.isFinite(n) ? n : 0;
    }

    function toNumber(raw) {
      const n = parseFloat(String(raw || "").replace(/[^\d.-]/g, ""));
      return Number.isFinite(n) ? n : 0;
    }

    function imgPath(p) {
      if (!p) return "";
      if (/^https?:\/\//i.test(p)) return p;
      return "../" + p.replace(/^\/+/, "");
    }

    // ------------------------------------------------------
    // Parser genérico del CSV mayorista (varios bloques repetidos)
    // ------------------------------------------------------
    function parseWholesaleBlocks(csvText) {
      const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: "greedy" });
      const rows = parsed.data;
      const items = [];

      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        for (let c = 0; c < row.length; c++) {
          if (
            normKey(row[c]) === "marca" &&
            normKey(row[c + 1]) === "perfume" &&
            normKey(row[c + 2]) === "precio"
          ) {
            let rr = r + 1;
            while (rr < rows.length) {
              const rowr = rows[rr] || [];
              const marca = (rowr[c] || "").trim();
              const nombre = (rowr[c + 1] || "").trim();
              if (!marca && !nombre) break;

              if (marca && nombre) {
                const precio = parseUSMoney(rowr[c + 2]);
                const stock = toNumber(rowr[c + 3]);
                const ml = toNumber(rowr[c + 4]);
                items.push({ marca, nombre, precio, stock, ml });
              }
              rr++;
            }
          }
        }
      }
      return items;
    }

    // ------------------------------------------------------
    // Carga principal
    // ------------------------------------------------------
    let WHOLESALE_ITEMS = [];
    let IMAGE_MAP = {}; // key: "marca|nombre" normalizado -> primera imagen

    async function cargarTodo() {
      const statusEl = document.getElementById("status");
      try {
        // 1) Catálogo principal (para las fotos)
        const catRes = await fetch(CATALOG_CSV, { cache: "no-store" });
        const catText = await catRes.text();
        const catParsed = Papa.parse(catText, { header: true, skipEmptyLines: true });

        catParsed.data.forEach((row) => {
          const clean = {};
          for (const k in row) {
            const kk = (k || "").replace(/^\uFEFF/, "").trim();
            clean[kk] = (row[k] ?? "").toString().trim();
          }
          const marca = clean.marca || clean.Marca || "";
          const nombre = clean.nombre || clean.Nombre || "";
          const imagenRaw = clean.imagenURL || clean.imagenUrl || clean.imagen || "";
          const firstImg = String(imagenRaw).split("|")[0].trim();
          if (marca && nombre && firstImg) {
            const key = normKey(marca) + "|" + normKey(nombre);
            IMAGE_MAP[key] = firstImg;
          }
        });

        // 2) Hoja mayorista
        const wRes = await fetch(WHOLESALE_CSV, { cache: "no-store" });
        const wText = await wRes.text();
        let items = parseWholesaleBlocks(wText);

        // Ocultar productos "no trabajados" (precio placeholder $900)
        items = items.filter((it) => Math.abs(it.precio - 900) > 0.01 && it.precio > 0);

          // Cruzar con imagen (solo coincidencia exacta, para evitar fotos equivocadas)
        items = items.map((it) => {
          const key = normKey(it.marca) + "|" + normKey(it.nombre);
          const img = IMAGE_MAP[key];
          return { ...it, img: img ? imgPath(img) : "" };
        });

        WHOLESALE_ITEMS = items;
        renderBrands(items);
        statusEl.style.display = "none";
      } catch (e) {
        console.error(e);
        statusEl.textContent = "No se pudo cargar la información mayorista.";
      }
    }

    function renderBrands(items) {
      const container = document.getElementById("brandsContainer");
      container.innerHTML = "";

      const byBrand = {};
      items.forEach((it) => {
        const key = it.marca.trim();
        byBrand[key] = byBrand[key] || [];
        byBrand[key].push(it);
      });

      const brandNames = Object.keys(byBrand).sort((a, b) =>
        a.localeCompare(b, "es", { sensitivity: "base" })
      );

      brandNames.forEach((brand) => {
        const block = document.createElement("div");
        block.className = "brand-block";

        const list = byBrand[brand].sort((a, b) =>
          a.nombre.localeCompare(b.nombre, "es", { sensitivity: "base" })
        );

        block.innerHTML = `
          <h2>${brand}</h2>
          <div class="items-grid">
            ${list
              .map(
                (it) => `
              <div class="item-card">
                ${
                  it.img
                    ? `<img src="${it.img}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'Sin foto'}))">`
                    : `<div class="noimg">Sin foto</div>`
                }
              <div class="info">
                  <p class="name">${it.nombre}</p>
                  <p class="price">${moneyAR(it.precio)}</p>
                  <p class="meta">Stock: ${it.stock} · ${it.ml} ml</p>
                </div>
              </div>
            `
              )
              .join("")}
          </div>
        `;
        container.appendChild(block);
      });
    }

    // ------------------------------------------------------
    // Descargar PDF completo
    // ------------------------------------------------------
    async function imageToDataURL(url) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return null;
      }
    }

    document.getElementById("downloadPdfBtn").addEventListener("click", async () => {
      const btn = document.getElementById("downloadPdfBtn");
      btn.disabled = true;
      const textoOriginal = btn.textContent;
      btn.textContent = "Generando PDF...";

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });

        const marginX = 15;
        const pageHeight = 297;
        const pageWidth = 210;
        let y = 20;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.text("Decantcias — Lista Mayorista", marginX, y);
        y += 10;

        const byBrand = {};
        WHOLESALE_ITEMS.forEach((it) => {
          byBrand[it.marca] = byBrand[it.marca] || [];
          byBrand[it.marca].push(it);
        });

        const brandNames = Object.keys(byBrand).sort((a, b) =>
          a.localeCompare(b, "es", { sensitivity: "base" })
        );

        for (const brand of brandNames) {
          if (y > pageHeight - 20) {
            doc.addPage();
            y = 20;
          }
          doc.setFont("helvetica", "bold");
          doc.setFontSize(13);
          doc.text(brand, marginX, y);
          y += 7;

          const list = byBrand[brand].sort((a, b) =>
            a.nombre.localeCompare(b.nombre, "es", { sensitivity: "base" })
          );

          for (const it of list) {
            if (y > pageHeight - 25) {
              doc.addPage();
              y = 20;
            }

            let dataUrl = null;
            if (it.img) {
              dataUrl = await imageToDataURL(it.img);
            }

            if (dataUrl) {
              try {
                doc.addImage(dataUrl, "JPEG", marginX, y - 4, 18, 18);
              } catch (e) {
                try {
                  doc.addImage(dataUrl, "PNG", marginX, y - 4, 18, 18);
                } catch (e2) {}
              }
            }

          doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.text(it.nombre, marginX + 24, y);
            doc.setFont("helvetica", "bold");
            doc.text(moneyAR(it.precio), marginX + 24, y + 6);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.text(`Stock: ${it.stock}  ·  ${it.ml} ml`, marginX + 24, y + 12);

            y += 26;
          }

          y += 4;
        }

        // Mensaje final
        if (y > pageHeight - 30) {
          doc.addPage();
          y = 20;
        } else {
          y += 10;
        }

        doc.setFont("helvetica", "italic");
        doc.setFontSize(10);
        const mensajeFinal = doc.splitTextToSize(
          "Recordá que si buscás algún perfume en específico, lo buscamos, te lo cotizamos y en 5 días hábiles te lo entregamos.",
          pageWidth - marginX * 2
        );
        doc.text(mensajeFinal, marginX, y);

        doc.save("decantcias-mayorista.pdf");
      } catch (e) {
        console.error(e);
        alert("Hubo un error generando el PDF. Revisá la consola.");
      } finally {
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    });
  </script>
</body>
</html>
